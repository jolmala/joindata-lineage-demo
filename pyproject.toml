[project]
name = "joindata-lineage-demo"
version = "0.1.0"
description = "Regulatory report lineage and PowerCenter export analysis on synthetic data"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
# The HTML template in demo.py has long CSS lines inside a string.
per-file-ignores = { "demo.py" = ["E501"] }
