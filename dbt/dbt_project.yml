name: joindata_orders
version: "1.0.0"
config-version: 2
profile: joindata_orders

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  as_of_date: "2026-10-31"  # reporting date of the HR example; $$AS_OF_DATE in PowerCenter

models:
  joindata_orders:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  joindata_orders:
    raw_customers:
      +column_types:
        updated_at: timestamp
    raw_orders:
      +column_types:
        order_date: date
    raw_fx_rates:
      +column_types:
        rate_date: date
        eur_per_unit: double
    raw_hr_employees:
      +column_types:
        emp_id: integer
        first_name: varchar
        dept_code: varchar
        employment_type: varchar
        hire_date: date
        term_date: date
        fte: decimal(4,2)
    raw_hr_departments:
      +column_types:
        cost_center: varchar
        valid_from: date
    legacy_dim_employee:
      +column_types:
        emp_id: integer
        cost_center: varchar
        hire_date: date
        term_date: date
        load_ts: timestamp
